name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gives the full history the shortcut scan needs to diff the
      # push/PR against its base; the default shallow clone has no base commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The no-shortcuts scanner, the same one the pre-commit and Stop hooks run, but
      # over exactly the range this push or PR introduces. It is the only check that is
      # otherwise local-only (a --no-verify commit or a clone that never set
      # core.hooksPath would slip past the hook), so CI is what makes it unskippable.
      - name: Shortcut scan
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # A new branch or an unavailable base has no usable "before"; fall back to
          # the previous commit so the scan still covers the latest change.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          sh scripts/check-shortcuts.sh --range "$base...HEAD"
      # rustup on the runner honors rust-toolchain.toml and fetches the pinned version.
      - run: rustup component add rustfmt clippy
      # Cache the cargo registry and target dir keyed on Cargo.lock + the toolchain, so
      # the heavy dependency tree (wgpu, egui, naga, …) compiles once and later runs only
      # rebuild the changed crates. Without it every run is a full clean build.
      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
      # --workspace on every step so CI always covers all crates, regardless of
      # any future default-members.
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --verbose
      # The release profile is a different compilation: `debug_assertions` is off, so anything
      # behind `cfg(debug_assertions)` vanishes and code that names it stops compiling. That is not
      # hypothetical, it is #300: the release build was broken for weeks because every step above
      # runs in debug and `release.yml` only builds on a `v*` tag, so the break would have surfaced
      # when cutting a release.
      #
      # `check` rather than `build`: it catches compile errors, which is the class that broke, for a
      # fraction of the time a full release codegen costs on every pull request. The real release
      # build still happens in `release.yml` at tag time.
      - name: Check the release profile
        run: cargo check --workspace --all-targets --release --verbose
      - name: Test
        run: cargo test --workspace --verbose
      # The node reference is generated from the running binary's registry. Regenerate it and fail
      # if the committed pages drift (modified or missing), so docs/reference/nodes/ can never fall
      # out of sync with the nodes. `git status --porcelain` catches a new node's page too, which a
      # plain `git diff` would miss.
      - name: Docs generate + drift check
        run: |
          cargo xtask docs-gen
          if [ -n "$(git status --porcelain -- docs/reference/nodes/)" ]; then
            echo "Generated node pages are out of date; run 'cargo xtask docs-gen' and commit:"
            git status --porcelain -- docs/reference/nodes/
            exit 1
          fi
      # Lint the docs: orphaned or invalid fragments, broken links, missing figures, forbidden
      # markers, relative design/ links, and completeness gaps on pages marked stable.
      - name: Docs lint
        run: cargo xtask docs-lint

  # Ymir is Linux-first but must not be Linux-only (#310). The workspace compiles for
  # x86_64-pc-windows-msvc when cross-checked from Linux, but a cross-check does not link, does
  # not run, and does not execute a test. This job does all three.
  #
  # Deliberately a separate job rather than a matrix over `check`: a Windows-only failure stays
  # legible in the checks list, and the Linux gate keeps its exact current shape.
  #
  # It runs a narrower set than `check`. Format and the docs and shortcut checks are
  # platform-independent, so running them twice buys nothing; what is Windows-specific is that the
  # code compiles, links, and passes its tests against a different libc, filesystem and process
  # model.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Which display adapters Windows itself reports, as context for whether the ymir-gpu tests
      # below ran or skipped. `windows-latest` has no physical GPU, but usually offers the
      # Microsoft Basic Render Driver (WARP), a software DX12 adapter. If it enumerates, this job
      # exercises the DX12 path, including its FXC shader compilation, for free.
      #
      # `continue-on-error` because this asserts nothing: it exists to put information in the log,
      # and a diagnostic that can fail the build inverts its purpose. The authoritative answer for
      # whether wgpu found an adapter is the ymir-gpu tests' own skip message in the Test step.
      #
      # Not `dxdiag`, which returns before it finishes writing its report, so reading the file
      # races the tool that produces it. CIM is synchronous and needs no temporary file.
      - name: Display adapters (diagnostic)
        continue-on-error: true
        shell: pwsh
        run: Get-CimInstance Win32_VideoController | Format-List Name, DriverVersion, VideoProcessor
      # The CLI's tests/render.rs spawns the real binary through CARGO_BIN_EXE, so this covers
      # linking and process spawning, not just compilation. The ymir-gpu tests skip gracefully
      # when no adapter is found, printing why; --nocapture keeps that visible.
      - name: Test
        run: cargo test --workspace --verbose -- --nocapture
      # Same reasoning as the Linux job: the release profile is a different compilation, and
      # `windows_subsystem` (#312) will apply only there, so a release-only break must not wait
      # for a tag to surface.
      - name: Check the release profile
        run: cargo check --workspace --all-targets --release --verbose

  # Exercise the GPU compute path (ymir-gpu marshalling and the thermal erosion kernel) on Mesa
  # lavapipe, a software Vulkan implementation, so a runner with no physical GPU still runs the
  # kernels rather than skipping them. Separate from `check` so a lavapipe hiccup cannot break the
  # main gate; the tests skip gracefully (printing why, visible with --nocapture) if no adapter is
  # found, so this job never fails on a host without a working Vulkan stack.
  gpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # lavapipe (the lvp ICD) plus the Vulkan loader (libvulkan1) it needs to be usable, and
      # vulkan-tools for the diagnostic below.
      - name: Install Mesa lavapipe (software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
      # Show which ICDs the loader can see, so a "no adapter" skip is diagnosable from the log.
      - name: Vulkan diagnostics
        run: |
          ls -la /usr/share/vulkan/icd.d/ || true
          vulkaninfo --summary 2>&1 | head -40 || true
      - uses: Swatinem/rust-cache@v2
      # The loader auto-discovers the lavapipe ICD in /usr/share/vulkan/icd.d/ (no VK_ICD override,
      # which previously pointed at a path that may not exist and suppressed discovery). --nocapture
      # surfaces a skip and its reason in the log if it still finds no adapter.
      - name: GPU tests on lavapipe
        run: |
          cargo test -p ymir-gpu --verbose -- --nocapture
          cargo test -p ymir-nodes --lib thermal_gpu --verbose -- --nocapture
